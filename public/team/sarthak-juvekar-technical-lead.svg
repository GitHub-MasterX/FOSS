<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="instaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3248" />
      <stop offset="100%" stop-color="#181a26" />
    </linearGradient>
    <linearGradient id="instaSilhouette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#a0aec0" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="100" height="100" rx="50" fill="url(#instaBg)" />
  
  <!-- Subtle inner border for crisp definition -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Head -->
  <circle cx="50" cy="36" r="16.5" fill="url(#instaSilhouette)" />

  <!-- Torso / Curved Shoulders (Instagram style) -->
